<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - CampusFixAI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="brand">Campus<span>FixAI</span> <small>ADMIN</small></div>
  <button class="btn small" onclick="logout()">Logout</button>
</nav>
<main class="container">
  <section class="hero">
    <div>
      <p class="eyebrow">ADMIN CONTROL CENTER</p>
      <h1>Complaint Dashboard</h1>
      <p>Monitor, assign and resolve campus issues.</p>
    </div>
  </section>

  <div class="stats">
    <div class="stat"><b id="aTotal">0</b><span>Total</span></div>
    <div class="stat"><b id="aPending">0</b><span>Pending</span></div>
    <div class="stat"><b id="aProgress">0</b><span>In Progress</span></div>
    <div class="stat"><b id="aResolved">0</b><span>Resolved</span></div>
  </div>

  <section class="card">
    <div class="toolbar">
      <input id="search" placeholder="Search ID, title, location..." oninput="renderAdmin()">
      <select id="statusFilter" onchange="renderAdmin()">
        <option value="ALL">All Status</option>
        <option value="SUBMITTED">Submitted</option>
        <option value="IN REVIEW">In Review</option>
        <option value="IN PROGRESS">In Progress</option>
        <option value="RESOLVED">Resolved</option>
      </select>
      <select id="priorityFilter" onchange="renderAdmin()">
        <option value="ALL">All Priority</option>
        <option value="HIGH">High</option>
        <option value="MEDIUM">Medium</option>
        <option value="LOW">Low</option>
      </select>
    </div>
    <div id="adminList"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
