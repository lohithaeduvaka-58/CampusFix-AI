<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | CampusFixAI</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🏫 CampusFix<span>AI</span></div>
  <div class="top-actions"><span class="user-chip">👨‍💼 Administrator</span><button class="text-btn" onclick="logout()">Logout</button></div>
</header>
<main class="container">
  <div class="page-title"><div><p class="eyebrow">ADMIN CONSOLE</p><h1>Campus issue dashboard</h1><p class="muted">Monitor, prioritize and resolve student complaints.</p></div><button class="btn btn-light" onclick="loadDemoData()">↻ Reset Demo Data</button></div>
  <section class="stats-grid">
    <div class="stat"><span>📋</span><div><b id="aTotal">0</b><small>Total</small></div></div>
    <div class="stat"><span>🟠</span><div><b id="aPending">0</b><small>Pending</small></div></div>
    <div class="stat"><span>🔵</span><div><b id="aProgress">0</b><small>In progress</small></div></div>
    <div class="stat"><span>🟢</span><div><b id="aResolved">0</b><small>Resolved</small></div></div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <h2>All complaints</h2>
      <div class="filters"><input class="search" id="adminSearch" placeholder="Search ID, title, location..." oninput="renderAdmin()"><select id="statusFilter" onchange="renderAdmin()"><option>All Status</option><option>Submitted</option><option>In Review</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select><select id="priorityFilter" onchange="renderAdmin()"><option>All Priority</option><option>High</option><option>Medium</option><option>Low</option></select></div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>Problem</th><th>Location</th><th>AI Category</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead><tbody id="adminTable"></tbody></table></div>
  </section>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="panel-head"><h2>Complaint details</h2><button class="close-btn" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script src="js/app.js"></script><script src="js/admin.js"></script>
</body>
</html>
