<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard - CampusFixAI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="brand">Campus<span>FixAI</span></div>
  <div><span id="studentName"></span> <button class="btn small" onclick="logout()">Logout</button></div>
</nav>
<main class="container">
  <section class="hero">
    <div>
      <p class="eyebrow">STUDENT PORTAL</p>
      <h1>Welcome back 👋</h1>
      <p>Report campus issues and track their resolution.</p>
    </div>
    <a class="btn primary" href="report.html">+ Report a Problem</a>
  </section>

  <div class="stats">
    <div class="stat"><b id="total">0</b><span>Total</span></div>
    <div class="stat"><b id="pending">0</b><span>Pending</span></div>
    <div class="stat"><b id="progress">0</b><span>In Progress</span></div>
    <div class="stat"><b id="resolved">0</b><span>Resolved</span></div>
  </div>

  <section class="card">
    <div class="section-title"><h2>My Complaints</h2><a href="track.html">Track by ID</a></div>
    <div id="complaintList"></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/student.js"></script>
</body>
</html>
