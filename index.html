<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusFixAI - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-card">
  <div class="brand">Campus<span>FixAI</span></div>
  <p class="muted">Smart Campus Complaint Management</p>
  <div class="tabs">
    <button class="tab active" onclick="showLogin('student')">Student</button>
    <button class="tab" onclick="showLogin('admin')">Admin</button>
  </div>

  <form id="studentLogin" onsubmit="studentLogin(event)">
    <h2>Student Login</h2>
    <label>Email</label>
    <input id="studentEmail" type="email" value="student@campusfix.ai" required>
    <label>Password</label>
    <input id="studentPassword" type="password" value="student123" required>
    <button class="btn primary" type="submit">Login as Student</button>
  </form>

  <form id="adminLogin" class="hidden" onsubmit="adminLogin(event)">
    <h2>Admin Login</h2>
    <label>Email</label>
    <input id="adminEmail" type="email" value="admin@campusfix.ai" required>
    <label>Password</label>
    <input id="adminPassword" type="password" value="admin123" required>
    <button class="btn primary" type="submit">Login as Admin</button>
  </form>

  <p id="loginMsg" class="message"></p>
  <div class="demo-box">
    <b>Demo accounts</b><br>
    Student: student@campusfix.ai / student123<br>
    Admin: admin@campusfix.ai / admin123
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
