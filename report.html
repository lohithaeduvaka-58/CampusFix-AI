<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Problem - CampusFixAI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <a class="brand" href="student.html">Campus<span>FixAI</span></a>
  <button class="btn small" onclick="logout()">Logout</button>
</nav>
<main class="container narrow">
<section class="card">
  <p class="eyebrow">NEW COMPLAINT</p>
  <h1>Report a Campus Problem</h1>
  <p class="muted">Describe the issue. CampusFixAI will suggest a category and priority.</p>

  <form id="reportForm" onsubmit="submitComplaint(event)">
    <label>Problem title</label>
    <input id="title" placeholder="e.g. Broken classroom fan" required>

    <label>Location / Building / Room</label>
    <input id="location" placeholder="e.g. CSE Block, Room 204" required>

    <label>Category</label>
    <select id="category">
      <option value="">Let AI detect</option>
      <option>Electrical</option>
      <option>Plumbing</option>
      <option>Cleaning</option>
      <option>Network</option>
      <option>Furniture</option>
      <option>Security</option>
      <option>Other</option>
    </select>

    <label>Description</label>
    <textarea id="description" rows="6" placeholder="Explain what happened..." required></textarea>

    <label>Photo (optional)</label>
    <input id="image" type="file" accept="image/*" onchange="previewImage(event)">
    <img id="preview" class="preview hidden" alt="Preview">

    <div class="ai-result">
      <b>AI analysis</b>
      <p id="aiPreview">Enter a description and click Analyze.</p>
      <button type="button" class="btn secondary" onclick="analyzeForm()">Analyze with CampusFixAI</button>
    </div>

    <button class="btn primary full" type="submit">Submit Complaint</button>
  </form>
  <p id="formMsg" class="message"></p>
</section>
</main>
<script src="js/app.js"></script>
<script src="js/report.js"></script>
</body>
</html>
